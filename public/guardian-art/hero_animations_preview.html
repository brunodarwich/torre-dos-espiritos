<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torre dos Espíritos — Preview das Animações Expressivas dos Guardiões</title>
  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: #171D2E;
      --card-border: #2D3748;
      --accent-gold: #F6E05E;
      --accent-jade: #48BB78;
      --accent-amber: #ED8936;
      --accent-cyan: #4FD1C5;
      --text: #F7FAFC;
      --text-muted: #A0AEC0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px 20px;
      line-height: 1.5;
    }

    header {
      max-width: 1240px;
      margin: 0 auto 32px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #F6E05E, #4FD1C5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 860px;
      margin: 0 auto 20px;
    }

    .hero-tabs, .speed-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn, .speed-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .speed-btn.active {
      background: #232B40;
      color: #FFF;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(79, 209, 197, 0.25);
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
    }

    .card.mentor::before { background: var(--accent-gold); }
    .card.benzedeira::before { background: var(--accent-jade); }
    .card.paje::before { background: var(--accent-amber); }

    .card-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .card-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .preview-stage {
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, #1F283D 0%, #0F1422 70%);
      border-radius: 12px;
      border: 1px solid #2D3748;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 16px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .preview-stage img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      image-rendering: auto;
      pointer-events: none;
    }

    .status-pill {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.65);
      color: var(--accent-gold);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pose-info {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-align: center;
    }

    .btn-attack {
      background: linear-gradient(135deg, #E53E3E, #DD6B20);
      color: white;
    }
    .btn-attack:hover { filter: brightness(1.15); transform: translateY(-1px); }

    .btn-idle {
      background: #2D3748;
      color: var(--text);
    }
    .btn-idle:hover { background: #4A5568; }

    .btn-step {
      background: #1A202C;
      border: 1px solid #4A5568;
      color: var(--accent-cyan);
      max-width: 50px;
    }

    .frames-strip {
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
    }

    .strip-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
    }

    .thumbs-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .thumb-box {
      width: 44px;
      height: 44px;
      background: #0F1422;
      border: 1px solid #2D3748;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .thumb-box:hover {
      border-color: rgba(255, 255, 255, 0.4);
    }

    .thumb-box img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .thumb-box.active {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(79, 209, 197, 0.4);
    }

    .thumb-tag {
      position: absolute;
      top: 1px;
      left: 2px;
      font-size: 0.55rem;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>

  <header>
    <h1>Animações Expressivas dos Guardiões</h1>
    <p class="subtitle">Visualizador das <strong>poses anatômicas articuladas</strong> (braços, mãos e cabeça), <strong>órbitas de cristais em translação real</strong>, <strong>faixas de aurora fluidas</strong> e <strong>fornalhas com labaredas vivas</strong> para os 3 heróis em seus 3 níveis.</p>

    <div class="speed-controls">
      <span style="align-self: center; font-size: 0.85rem; color: var(--text-muted);">Velocidade:</span>
      <button class="speed-btn active" onclick="setSpeed(1.0)">1.0x (Normal)</button>
      <button class="speed-btn" onclick="setSpeed(0.5)">0.5x (Câmera Lenta)</button>
      <button class="speed-btn" onclick="setSpeed(0.25)">0.25x (Super Lenta)</button>
    </div>

    <div class="hero-tabs">
      <button class="tab-btn active" onclick="filterHero('all')">Todos os Guardiões (9 Variantes)</button>
      <button class="tab-btn" onclick="filterHero('mentor')">Prisma Solar</button>
      <button class="tab-btn" onclick="filterHero('benzedeira')">Véu de Aurora</button>
      <button class="tab-btn" onclick="filterHero('paje')">Núcleo de Brasa</button>
    </div>
  </header>

  <div class="container" id="cards-container"></div>

  <script>
    const basePath = '../../frontend/public/assets/astral/heroes/';
    const cacheBust = '?t=' + Date.now();
    let currentSpeed = 1.0;

    const HEROES = [
      {
        id: 'mentor',
        name: 'Prisma Solar',
        colorClass: 'mentor',
        poseNotes: ['Postura inicial', 'Inspiração solar & pulso', 'Retorno suave'],
        levels: [
          { lvl: 1, title: 'Centelha' },
          { lvl: 2, title: 'Sentinela Solar' },
          { lvl: 3, title: 'Avatar Prismático' }
        ]
      },
      {
        id: 'benzedeira',
        name: 'Véu de Aurora',
        colorClass: 'benzedeira',
        poseNotes: ['Repouso sereno', 'Ondulação das faixas', 'Assentamento'],
        levels: [
          { lvl: 1, title: 'Vigia da Aurora' },
          { lvl: 2, title: 'Tecelão Astral' },
          { lvl: 3, title: 'Guardião da Aurora' }
        ]
      },
      {
        id: 'paje',
        name: 'Núcleo de Brasa',
        colorClass: 'paje',
        poseNotes: ['Guarda de basalto', 'Labareda viva & fissuras', 'Assentamento'],
        levels: [
          { lvl: 1, title: 'Braseiro Vivo' },
          { lvl: 2, title: 'Cavaleiro Ígneo' },
          { lvl: 3, title: 'Colosso de Brasa' }
        ]
      }
    ];

    const players = {};

    function init() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      HEROES.forEach(hero => {
        hero.levels.forEach(l => {
          const key = `${hero.id}_lvl${l.lvl}`;
          const card = document.createElement('div');
          card.className = `card ${hero.colorClass}`;
          card.dataset.hero = hero.id;

          card.innerHTML = `
            <div class="card-header">
              <div class="card-title">${hero.name} · Nv.${l.lvl}</div>
              <div class="card-badge">${l.title}</div>
            </div>

            <div class="preview-stage">
              <img id="img-${key}" src="${basePath}${key}_idle_1.png${cacheBust}" alt="${key}">
              <div class="status-pill" id="pill-${key}">IDLE (LOOP)</div>
              <div class="pose-info" id="pose-${key}">${hero.poseNotes[0]}</div>
            </div>

            <div class="controls">
              <button class="btn btn-attack" onclick="triggerAttack('${key}')">⚔️ Atacar</button>
              <button class="btn btn-idle" onclick="resetIdle('${key}')">🔄 Loop Espera</button>
              <button class="btn btn-step" title="Próximo Quadro" onclick="stepFrame('${key}')">⏯️</button>
            </div>

            <div class="frames-strip">
              <div class="strip-label">
                <span>3 Idle + 4 Ataque</span>
                <span style="color: var(--accent-cyan); font-weight: 600;">Clique no quadro para pausar</span>
              </div>
              <div class="thumbs-row">
                <div class="thumb-box active" id="th-${key}-idle_1" onclick="previewSingleFrame('${key}', 'idle_1')">
                  <span class="thumb-tag">I1</span>
                  <img src="${basePath}${key}_idle_1.png${cacheBust}">
                </div>
                <div class="thumb-box" id="th-${key}-idle_2" onclick="previewSingleFrame('${key}', 'idle_2')">
                  <span class="thumb-tag">I2</span>
                  <img src="${basePath}${key}_idle_2.png${cacheBust}">
                </div>
                <div class="thumb-box" id="th-${key}-idle_3" onclick="previewSingleFrame('${key}', 'idle_3')">
                  <span class="thumb-tag">I3</span>
                  <img src="${basePath}${key}_idle_3.png${cacheBust}">
                </div>
                <div class="thumb-box" id="th-${key}-atk_1" onclick="previewSingleFrame('${key}', 'atk_1')">
                  <span class="thumb-tag">A1</span>
                  <img src="${basePath}${key}_atk_1.png${cacheBust}">
                </div>
                <div class="thumb-box" id="th-${key}-atk_2" onclick="previewSingleFrame('${key}', 'atk_2')">
                  <span class="thumb-tag">A2</span>
                  <img src="${basePath}${key}_atk_2.png${cacheBust}">
                </div>
                <div class="thumb-box" id="th-${key}-atk_3" onclick="previewSingleFrame('${key}', 'atk_3')">
                  <span class="thumb-tag">A3</span>
                  <img src="${basePath}${key}_atk_3.png${cacheBust}">
                </div>
                <div class="thumb-box" id="th-${key}-atk_4" onclick="previewSingleFrame('${key}', 'atk_4')">
                  <span class="thumb-tag">A4</span>
                  <img src="${basePath}${key}_atk_4.png${cacheBust}">
                </div>
              </div>
            </div>
          `;

          container.appendChild(card);
          startPlayer(key, hero.poseNotes);
        });
      });
    }

    function startPlayer(key, poseNotes) {
      players[key] = {
        state: 'idle',
        frameIdx: 0,
        poseNotes: poseNotes || [],
        idleFrames: [
          `${basePath}${key}_idle_1.png${cacheBust}`,
          `${basePath}${key}_idle_2.png${cacheBust}`,
          `${basePath}${key}_idle_3.png${cacheBust}`
        ],
        attackFrames: [
          `${basePath}${key}_atk_1.png${cacheBust}`,
          `${basePath}${key}_atk_2.png${cacheBust}`,
          `${basePath}${key}_atk_3.png${cacheBust}`,
          `${basePath}${key}_atk_4.png${cacheBust}`
        ],
        timer: null
      };

      runIdleLoop(key);
    }

    function runIdleLoop(key) {
      const p = players[key];
      if (p.timer) clearTimeout(p.timer);
      p.state = 'idle';

      const update = () => {
        if (p.state !== 'idle') return;
        p.frameIdx = (p.frameIdx + 1) % p.idleFrames.length;
        const img = document.getElementById(`img-${key}`);
        const pill = document.getElementById(`pill-${key}`);
        const poseEl = document.getElementById(`pose-${key}`);

        if (img) img.src = p.idleFrames[p.frameIdx];
        if (pill) {
          pill.innerText = `ESPERA (${p.frameIdx + 1}/3)`;
          pill.style.color = '#F6E05E';
        }
        if (poseEl && p.poseNotes[p.frameIdx]) {
          poseEl.innerText = p.poseNotes[p.frameIdx];
        }

        highlightThumb(key, `idle_${p.frameIdx + 1}`);
        const delay = Math.round(250 / currentSpeed);
        p.timer = setTimeout(update, delay);
      };

      const delay = Math.round(250 / currentSpeed);
      p.timer = setTimeout(update, delay);
    }

    function triggerAttack(key) {
      const p = players[key];
      if (p.timer) clearTimeout(p.timer);
      p.state = 'attack';
      p.frameIdx = 0;

      const img = document.getElementById(`img-${key}`);
      const pill = document.getElementById(`pill-${key}`);
      const poseEl = document.getElementById(`pose-${key}`);
      const attackDelays = [100, 150, 130, 100];
      const attackPoseNames = ['Wind-up / Recuo', 'Disparo / Extensão', 'Follow-through', 'Recuperação'];

      const step = (idx) => {
        if (idx >= p.attackFrames.length) {
          runIdleLoop(key);
          return;
        }

        if (img) img.src = p.attackFrames[idx];
        if (pill) {
          pill.innerText = `ATAQUE (${idx + 1}/4)`;
          pill.style.color = '#E53E3E';
        }
        if (poseEl) {
          poseEl.innerText = attackPoseNames[idx];
        }
        highlightThumb(key, `atk_${idx + 1}`);

        const delay = Math.round(attackDelays[idx] / currentSpeed);
        p.timer = setTimeout(() => step(idx + 1), delay);
      };

      step(0);
    }

    function resetIdle(key) {
      runIdleLoop(key);
    }

    function stepFrame(key) {
      const p = players[key];
      if (p.timer) clearTimeout(p.timer);
      p.state = 'paused';

      p.frameIdx = (p.frameIdx + 1) % p.idleFrames.length;
      const img = document.getElementById(`img-${key}`);
      const pill = document.getElementById(`pill-${key}`);
      const poseEl = document.getElementById(`pose-${key}`);

      if (img) img.src = p.idleFrames[p.frameIdx];
      if (pill) {
        pill.innerText = `PAUSA (${p.frameIdx + 1}/3)`;
        pill.style.color = '#4FD1C5';
      }
      if (poseEl && p.poseNotes[p.frameIdx]) {
        poseEl.innerText = p.poseNotes[p.frameIdx];
      }
      highlightThumb(key, `idle_${p.frameIdx + 1}`);
    }

    function previewSingleFrame(key, frameTag) {
      const p = players[key];
      if (p.timer) clearTimeout(p.timer);
      p.state = 'paused';

      const img = document.getElementById(`img-${key}`);
      const pill = document.getElementById(`pill-${key}`);
      if (img) img.src = `${basePath}${key}_${frameTag}.png${cacheBust}`;
      if (pill) {
        pill.innerText = `FRAME: ${frameTag.toUpperCase()}`;
        pill.style.color = '#4FD1C5';
      }
      highlightThumb(key, frameTag);
    }

    function highlightThumb(key, tag) {
      const all = ['idle_1', 'idle_2', 'idle_3', 'atk_1', 'atk_2', 'atk_3', 'atk_4'];
      all.forEach(t => {
        const el = document.getElementById(`th-${key}-${t}`);
        if (el) el.classList.remove('active');
      });
      const active = document.getElementById(`th-${key}-${tag}`);
      if (active) active.classList.add('active');
    }

    function setSpeed(speed) {
      currentSpeed = speed;
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      Object.keys(players).forEach(k => {
        if (players[k].state === 'idle') {
          runIdleLoop(k);
        }
      });
    }

    function filterHero(heroId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      document.querySelectorAll('.card').forEach(card => {
        if (heroId === 'all' || card.dataset.hero === heroId) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    window.onload = init;
  </script>
</body>
</html>
