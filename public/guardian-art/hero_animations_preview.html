<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torre dos Espíritos — Preview das Animações dos Guardiões (Idle & Attack)</title>
  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: #171D2E;
      --card-border: #2D3748;
      --accent-gold: #F6E05E;
      --accent-jade: #48BB78;
      --accent-amber: #ED8936;
      --accent-cyan: #4FD1C5;
      --text: #F7FAFC;
      --text-muted: #A0AEC0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px 20px;
      line-height: 1.5;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 36px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #F6E05E, #4FD1C5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 800px;
      margin: 0 auto 20px;
    }

    .hero-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #232B40;
      color: #FFF;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(79, 209, 197, 0.25);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
    }

    .card.mentor::before { background: var(--accent-gold); }
    .card.benzedeira::before { background: var(--accent-jade); }
    .card.paje::before { background: var(--accent-amber); }

    .card-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .card-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .preview-stage {
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, #1F283D 0%, #0F1422 70%);
      border-radius: 12px;
      border: 1px solid #2D3748;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 16px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .preview-stage img {
      width: 210px;
      height: 210px;
      object-fit: contain;
      image-rendering: auto;
      pointer-events: none;
    }

    .status-pill {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.65);
      color: var(--accent-gold);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-align: center;
    }

    .btn-attack {
      background: linear-gradient(135deg, #E53E3E, #DD6B20);
      color: white;
    }
    .btn-attack:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .btn-attack:active { transform: translateY(1px); }

    .btn-idle {
      background: #2D3748;
      color: var(--text);
    }
    .btn-idle:hover { background: #4A5568; }

    .frames-strip {
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
    }

    .strip-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .thumbs-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .thumb-box {
      width: 44px;
      height: 44px;
      background: #0F1422;
      border: 1px solid #2D3748;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .thumb-box img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .thumb-box.active {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(79, 209, 197, 0.4);
    }

    .thumb-tag {
      position: absolute;
      top: 1px;
      left: 2px;
      font-size: 0.55rem;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>

  <header>
    <h1>Animações dos Guardiões Astrais</h1>
    <p class="subtitle">Visualizador em tempo real dos ciclos de <strong>Espera (Idle de 3 quadros em looping)</strong> e <strong>Ataque fluido (4 quadros com disparo e impacto)</strong> para todos os 3 guardiões em seus 3 níveis.</p>
    
    <div class="hero-tabs">
      <button class="tab-btn active" onclick="filterHero('all')">Todos os Guardiões (9 Variantes)</button>
      <button class="tab-btn" onclick="filterHero('mentor')">Prisma Solar</button>
      <button class="tab-btn" onclick="filterHero('benzedeira')">Véu de Aurora</button>
      <button class="tab-btn" onclick="filterHero('paje')">Núcleo de Brasa</button>
    </div>
  </header>

  <div class="container" id="cards-container">
    <!-- Gerado dinamicamente via JS -->
  </div>

  <script>
    const basePath = '../../frontend/public/assets/astral/heroes/';

    const HEROES = [
      {
        id: 'mentor',
        name: 'Prisma Solar',
        colorClass: 'mentor',
        levels: [
          { lvl: 1, title: 'Centelha' },
          { lvl: 2, title: 'Sentinela Solar' },
          { lvl: 3, title: 'Avatar Prismático' }
        ]
      },
      {
        id: 'benzedeira',
        name: 'Véu de Aurora',
        colorClass: 'benzedeira',
        levels: [
          { lvl: 1, title: 'Vigia da Aurora' },
          { lvl: 2, title: 'Tecelão Astral' },
          { lvl: 3, title: 'Guardião da Aurora' }
        ]
      },
      {
        id: 'paje',
        name: 'Núcleo de Brasa',
        colorClass: 'paje',
        levels: [
          { lvl: 1, title: 'Braseiro Vivo' },
          { lvl: 2, title: 'Cavaleiro Ígneo' },
          { lvl: 3, title: 'Colosso de Brasa' }
        ]
      }
    ];

    const players = {};

    function init() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      HEROES.forEach(hero => {
        hero.levels.forEach(l => {
          const key = `${hero.id}_lvl${l.lvl}`;
          const card = document.createElement('div');
          card.className = `card ${hero.colorClass}`;
          card.dataset.hero = hero.id;

          card.innerHTML = `
            <div class="card-header">
              <div class="card-title">${hero.name} · Nv.${l.lvl}</div>
              <div class="card-badge">${l.title}</div>
            </div>

            <div class="preview-stage">
              <img id="img-${key}" src="${basePath}${key}_idle_1.png" alt="${key}">
              <div class="status-pill" id="pill-${key}">IDLE (LOOP)</div>
            </div>

            <div class="controls">
              <button class="btn btn-attack" onclick="triggerAttack('${key}')">⚔️ Atacar</button>
              <button class="btn btn-idle" onclick="resetIdle('${key}')">🔄 Loop Espera</button>
            </div>

            <div class="frames-strip">
              <div class="strip-label">Quadros da Animação (3 Idle + 4 Ataque)</div>
              <div class="thumbs-row">
                <div class="thumb-box active" id="th-${key}-idle_1">
                  <span class="thumb-tag">I1</span>
                  <img src="${basePath}${key}_idle_1.png">
                </div>
                <div class="thumb-box" id="th-${key}-idle_2">
                  <span class="thumb-tag">I2</span>
                  <img src="${basePath}${key}_idle_2.png">
                </div>
                <div class="thumb-box" id="th-${key}-idle_3">
                  <span class="thumb-tag">I3</span>
                  <img src="${basePath}${key}_idle_3.png">
                </div>
                <div class="thumb-box" id="th-${key}-atk_1">
                  <span class="thumb-tag">A1</span>
                  <img src="${basePath}${key}_atk_1.png">
                </div>
                <div class="thumb-box" id="th-${key}-atk_2">
                  <span class="thumb-tag">A2</span>
                  <img src="${basePath}${key}_atk_2.png">
                </div>
                <div class="thumb-box" id="th-${key}-atk_3">
                  <span class="thumb-tag">A3</span>
                  <img src="${basePath}${key}_atk_3.png">
                </div>
                <div class="thumb-box" id="th-${key}-atk_4">
                  <span class="thumb-tag">A4</span>
                  <img src="${basePath}${key}_atk_4.png">
                </div>
              </div>
            </div>
          `;

          container.appendChild(card);
          startPlayer(key);
        });
      });
    }

    function startPlayer(key) {
      players[key] = {
        state: 'idle', // 'idle' ou 'attack'
        frameIdx: 0,
        idleFrames: [
          `${basePath}${key}_idle_1.png`,
          `${basePath}${key}_idle_2.png`,
          `${basePath}${key}_idle_3.png`
        ],
        attackFrames: [
          `${basePath}${key}_atk_1.png`,
          `${basePath}${key}_atk_2.png`,
          `${basePath}${key}_atk_3.png`,
          `${basePath}${key}_atk_4.png`
        ],
        timer: null
      };

      runIdleLoop(key);
    }

    function runIdleLoop(key) {
      const p = players[key];
      if (p.timer) clearTimeout(p.timer);
      p.state = 'idle';

      const update = () => {
        if (p.state !== 'idle') return;
        p.frameIdx = (p.frameIdx + 1) % p.idleFrames.length;
        const img = document.getElementById(`img-${key}`);
        const pill = document.getElementById(`pill-${key}`);
        if (img) img.src = p.idleFrames[p.frameIdx];
        if (pill) {
          pill.innerText = `ESPERA (${p.frameIdx + 1}/3)`;
          pill.style.color = '#F6E05E';
        }

        highlightThumb(key, `idle_${p.frameIdx + 1}`);
        p.timer = setTimeout(update, 250); // 4 FPS
      };

      p.timer = setTimeout(update, 250);
    }

    function triggerAttack(key) {
      const p = players[key];
      if (p.timer) clearTimeout(p.timer);
      p.state = 'attack';
      p.frameIdx = 0;

      const img = document.getElementById(`img-${key}`);
      const pill = document.getElementById(`pill-${key}`);

      const attackDelays = [80, 120, 110, 90]; // Sequência fluida de impacto

      const step = (idx) => {
        if (idx >= p.attackFrames.length) {
          // Fim do ataque -> volta suave para Idle
          runIdleLoop(key);
          return;
        }

        if (img) img.src = p.attackFrames[idx];
        if (pill) {
          pill.innerText = `ATAQUE (${idx + 1}/4)`;
          pill.style.color = '#E53E3E';
        }
        highlightThumb(key, `atk_${idx + 1}`);

        p.timer = setTimeout(() => step(idx + 1), attackDelays[idx]);
      };

      step(0);
    }

    function resetIdle(key) {
      runIdleLoop(key);
    }

    function highlightThumb(key, tag) {
      const all = ['idle_1', 'idle_2', 'idle_3', 'atk_1', 'atk_2', 'atk_3', 'atk_4'];
      all.forEach(t => {
        const el = document.getElementById(`th-${key}-${t}`);
        if (el) el.classList.remove('active');
      });
      const active = document.getElementById(`th-${key}-${tag}`);
      if (active) active.classList.add('active');
    }

    function filterHero(heroId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      document.querySelectorAll('.card').forEach(card => {
        if (heroId === 'all' || card.dataset.hero === heroId) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    window.onload = init;
  </script>
</body>
</html>
